services:
  db:
    image: postgres:16-alpine
    container_name: sonido-vivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonido_vivo
      POSTGRES_USER: ${DB_USER:-sonido_vivo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
