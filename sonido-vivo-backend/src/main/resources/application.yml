server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sonido_vivo}
    username: ${DB_USER:sonido_vivo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  demo-password: ${DEMO_PASSWORD}
